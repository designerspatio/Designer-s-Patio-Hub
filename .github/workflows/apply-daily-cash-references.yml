name: Apply cash client and sales references
on:
  push:
    branches: [feature/daily-cash-client-sales-references-20261119]
    paths: [.github/workflows/apply-daily-cash-references.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/daily-cash-client-sales-references-20261119
          persist-credentials: true
      - name: Apply verified cash-reference patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/daily-cash-clients.patch.gz.b64 | gzip -d > /tmp/daily-cash-clients.patch
          git apply --check /tmp/daily-cash-clients.patch
          git apply /tmp/daily-cash-clients.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Show client and sales-order references in cash journal"
          git push origin HEAD:feature/daily-cash-client-sales-references-20261119

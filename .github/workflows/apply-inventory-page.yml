name: Apply inventory integration patch
on:
  push:
    branches:
      - feature/inventory-sellable-availability-20261104
    paths:
      - .github/workflows/apply-inventory-page.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-sellable-availability-20261104
          persist-credentials: true
      - name: Apply tested quote and inventory screen changes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/inventory-page.patch.gz.b64 | gzip -d > /tmp/inventory-page.patch
          git apply --check /tmp/inventory-page.patch
          git apply /tmp/inventory-page.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Integrate inventory availability into quote, sale, and stock editors"
          git push origin HEAD:feature/inventory-sellable-availability-20261104

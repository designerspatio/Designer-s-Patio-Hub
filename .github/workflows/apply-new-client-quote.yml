name: Apply quote client creation update
on:
  push:
    branches: [feature/new-client-inside-quote-20261106]
    paths: [.github/workflows/apply-new-client-quote.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-client-inside-quote-20261106
          persist-credentials: true
      - name: Apply verified quote editor patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/new-client-quote.patch.gz.b64 | gzip -d > /tmp/new-client-quote.patch
          git apply --check /tmp/new-client-quote.patch
          git apply /tmp/new-client-quote.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Add create-and-select new client within quote editor"
          git push origin HEAD:feature/new-client-inside-quote-20261106

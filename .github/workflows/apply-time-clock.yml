name: Integrate Sunday-Saturday staff time clock
on:
  push:
    branches: [feature/staff-timeclock-sunday-saturday-20261119]
    paths: [.github/workflows/apply-time-clock.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/staff-timeclock-sunday-saturday-20261119
          persist-credentials: true
      - name: Add time clock to existing dashboards
        run: python3 scripts/apply-time-clock.py
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Validate timecard calculations
        run: node --test tests/time-clock.test.cjs
      - name: Build
        run: npm run build
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Show time clocks on Andrew, Niyah and Geneva dashboards"
          git push origin HEAD:feature/staff-timeclock-sunday-saturday-20261119

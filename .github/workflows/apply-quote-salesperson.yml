name: Apply quote salesperson defaults
on:
  push:
    branches: [feature/quote-salesperson-auto-owner-20261106]
    paths: [.github/workflows/apply-quote-salesperson.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quote-salesperson-auto-owner-20261106
          persist-credentials: true
      - name: Apply tested quote assignment patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/quote-salesperson.patch.gz.b64 | gzip -d > /tmp/quote-salesperson.patch
          git apply --check /tmp/quote-salesperson.patch
          git apply /tmp/quote-salesperson.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Default quote salesperson to client primary and enable owner choice"
          git push origin HEAD:feature/quote-salesperson-auto-owner-20261106
